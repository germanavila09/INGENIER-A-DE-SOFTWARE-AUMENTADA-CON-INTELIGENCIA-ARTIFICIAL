[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-ing"
version = "0.1.0"
description = "Ingeniería de Software Aumentada con IA — agentes y sistema multiagente con Google ADK sobre gs://adk_ing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-storage>=2.16",
    "google-adk>=1.0",
    "python-dotenv>=1.0",
    # lectura de documentos
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # sistema multiagente
    "pyyaml>=6.0",
    "pydantic>=2.6",
    # API y carga de archivos del Smart Product Backlog (/api, /spb)
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adk-ing = "adk_ing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "agents", "tests"]
